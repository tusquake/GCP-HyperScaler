apiVersion: v1
kind: ConfigMap
metadata:
  name: config-app-env
data:
  APP_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-app-db
type: Opaque
stringData:
  API_SECRET_TOKEN: "SUPER_SECRET_API_TOKEN_XYZ"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-node-api
  labels:
    app: node-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      containers:
      - name: node-api
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: config-app-env
              key: APP_ENV
        - name: API_SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app-db
              key: API_SECRET_TOKEN
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: svc-api-backend
spec:
  type: ClusterIP
  selector:
    app: node-api
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-node-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-node-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
