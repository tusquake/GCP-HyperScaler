# Nginx Configuration for React SPA on Cloud Run
# Serves static files and handles SPA client-side routing

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy for React SPA
    # 'self' for scripts/styles, 'unsafe-inline' for React inline styles,
    # Google Fonts for typography, data: and blob: for file previews
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.run.app https://*.googleapis.com; frame-ancestors 'none'" always;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Cache static assets aggressively (Vite uses content hashes in filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve static files, fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run
    location /healthz {
        access_log off;
        return 200 '{"status":"HEALTHY","service":"secure-vault-frontend"}';
        add_header Content-Type application/json;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        return 404;
    }
}
